# Image của fork dbaas: ghcr.io/<owner>/clickhouse-operator và ghcr.io/<owner>/clickhouse-metrics-exporter.
#
# Tự chạy khi push tag <upstream>-dbaas.N (ví dụ 0.27.4-dbaas.1) trên nhánh release/<upstream>-dbaas.
# Chạy tay cho tag/nhánh có sẵn (version lấy từ file release khi không đứng đúng tag dbaas):
#   gh workflow run dbaas-image.yaml -R ngtukien/clickhouse-operator --ref release/0.27.4-dbaas
# Digest in ở Summary, ghim vào dbaas: infra/ansible/group_vars/all.yml → images.clickhouse_*.
# Chỉ linux/amd64 (lab là EC2 x86); build_branch.yaml của upstream vẫn giữ cho Docker Hub của Altinity.
name: dbaas-image

on:
  push:
    tags:
      - '*-dbaas.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag hoặc commit cần build (mặc định là ref đang chạy)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          set -euo pipefail
          tag=$(git describe --tags --exact-match 2>/dev/null || true)
          case "$tag" in
            *-dbaas.*) echo "version=${tag#v}" >> "$GITHUB_OUTPUT" ;;
            *)         echo "version=$(cat release)" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "go=$(grep '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build arg giống build_branch.yaml của upstream; GODEBUG_FIPS140=off giữ hành vi mặc định
      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GO_VERSION: ${{ steps.version.outputs.go }}
        run: |
          set -euo pipefail
          for img in operator:clickhouse-operator metrics-exporter:clickhouse-metrics-exporter; do
            dir=${img%%:*}; name=${img##*:}
            docker buildx build --progress plain --platform linux/amd64 \
              -f "dockerfile/$dir/Dockerfile" \
              --build-arg GO_VERSION="$GO_VERSION" --build-arg GOFIPS140=v1.0.0 --build-arg GODEBUG_FIPS140=off \
              --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
              -t "$PREFIX/$name:$VERSION" --push .
          done

      - name: Digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Image"
            echo '```'
            for name in clickhouse-operator clickhouse-metrics-exporter; do
              digest=$(docker buildx imagetools inspect "$PREFIX/$name:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
              echo "$PREFIX/$name:$VERSION@$digest"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
